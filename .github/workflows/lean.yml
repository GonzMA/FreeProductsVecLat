name: Lean build and proof audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check generated imports, inventory, and audit
        run: python3 scripts/audit_source.py --check
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-github-cache: false
      - name: Audit theorem axiom dependencies
        run: lake env lean scripts/ProofAudit.lean
